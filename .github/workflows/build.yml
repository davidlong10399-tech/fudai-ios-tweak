name: Build rootless tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$RUNNER_TEMP/theos/makefiles" >> "$GITHUB_ENV"

      - name: Select Apple SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS.sdk"

      - name: Package rootless deb
        run: make package THEOS="$THEOS" THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Validate package layout
        run: |
          set -euo pipefail
          deb=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          ! dpkg-deb -c "$deb" | grep -E 'var/jb/var/jb|^.* ./var/jb/'
          dpkg-deb -c "$deb" | grep -E 'Library/MobileSubstrate/DynamicLibraries/FuDai\.(dylib|plist)'

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudai-ios-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
